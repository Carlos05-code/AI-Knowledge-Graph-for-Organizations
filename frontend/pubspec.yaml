name: ai_knowledge_graph
description: "AI Knowledge Graph for Organizations — Enterprise frontend"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_markdown: ^0.7.4
  flutter_animate: ^4.5.2

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0
  retrofit: ^4.4.1

  # Storage
  flutter_secure_storage: ^9.2.3
  shared_preferences: ^2.3.4

  # File handling
  file_picker: ^8.1.6
  open_file: ^3.5.7

  # Data
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4
  intl: ^0.19.0

  # Graph visualization
  graphview: ^1.2.0

  # PDF viewing
  flutter_pdfview: ^1.3.2

  # Charts
  fl_chart: ^0.69.2

  # Utilities
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  connectivity_plus: ^6.1.1
  device_info_plus: ^11.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.9.0
  freezed: ^2.5.7
  retrofit_generator: ^9.1.5
  riverpod_generator: ^2.6.3
  mockito: ^5.4.4
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
