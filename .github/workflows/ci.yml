name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ai_knowledge_graph
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U postgres
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npm audit --audit-level=high

      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_knowledge_graph

      - run: npm run lint

      - run: npx jest --passWithNoTests
        env:
          NODE_ENV: test

      - run: npm run build

      - run: docker build -t akg-backend -f ../docker/Dockerfile.backend .
        if: github.ref == 'refs/heads/main'

  frontend:
    name: Frontend — Lint, Test & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.35.x"
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter build web --release --no-tree-shake-icons

      - run: docker build -t akg-frontend -f ../docker/Dockerfile.frontend .
        if: github.ref == 'refs/heads/main'

  docker:
    name: Docker — Compose Validation
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - run: docker compose -f docker/docker-compose.yml config

zap-baseline:
    name: Security - OWASP ZAP Baseline
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Login and capture auth token
        run: |
          mkdir -p backend/test/zap/reports
          TOKEN=$(curl -s -X POST "${{ secrets.STAGING_URL }}/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email": "sso@acme.com", "password": "password123"}' | jq -r .accessToken)
          if [ -z "$TOKEN" ]; then
            echo "::error ::Failed to login, no token returned"
            exit 1
          fi
          echo "Auth token captured (first 10 chars): ${TOKEN:0:10}"

      - name: Run ZAP baseline scan
        run: |
          mkdir -p backend/test/zap/reports
          docker run --rm \
            -v $PWD/backend/test/zap/reports:/zap/wrk/:rw \
            -u zap \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t "${{ secrets.STAGING_URL }}" \
            -l WARN \
            -r zap-report.html \
            -J zap-report.json \
            -w zap-report.md \
            -x zap-report.xml

      - name: Check for HIGH alerts
        run: |
          python3 - <<'PY'
          import json, sys
          with open("backend/test/zap/reports/zap-report.json", encoding="utf-8") as f:
              data = json.load(f)
          high = [
              a for a in data.get("site", [])
              if any(int(i.get("riskcode", 0)) >= 3 for i in a.get("alerts", []))
          ]
          if high:
              print(f"ZAP scan FAILED: {len(high)} HIGH-risk alert(s).")
              sys.exit(1)
          print("ZAP scan passed: no HIGH-risk alerts.")
          PY

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: backend/test/zap/reports/
          retention-days: 14
