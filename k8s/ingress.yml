apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: akg-ingress
  namespace: akg
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.akg.company.com
        - api.akg.company.com
      secretName: akg-tls
  rules:
    - host: app.akg.company.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: akg-frontend
                port:
                  number: 80
    - host: api.akg.company.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: akg-backend
                port:
                  number: 3000
