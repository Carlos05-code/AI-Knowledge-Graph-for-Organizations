apiVersion: apps/v1
kind: Deployment
metadata:
  name: akg-backend
  namespace: akg
  labels:
    app: akg-backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: akg-backend
  template:
    metadata:
      labels:
        app: akg-backend
    spec:
      containers:
        - name: backend
          image: akg-backend:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: APP_PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: akg-secrets
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: akg-secrets
                  key: jwt-secret
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: akg-secrets
                  key: openai-api-key
            - name: NEO4J_URI
              value: "bolt://akg-neo4j:7687"
            - name: NEO4J_USER
              value: "neo4j"
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: akg-secrets
                  key: neo4j-password
            - name: REDIS_HOST
              value: "akg-redis"
            - name: RABBITMQ_URL
              value: "amqp://guest:guest@akg-rabbitmq:5672"
            - name: MINIO_HOST
              value: "http://akg-minio:9000"
            - name: QDRANT_HOST
              value: "akg-qdrant"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: akg-backend
  namespace: akg
spec:
  selector:
    app: akg-backend
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: akg-backend
  namespace: akg
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: akg-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
