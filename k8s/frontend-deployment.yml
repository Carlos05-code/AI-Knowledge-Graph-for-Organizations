apiVersion: apps/v1
kind: Deployment
metadata:
  name: akg-frontend
  namespace: akg
  labels:
    app: akg-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: akg-frontend
  template:
    metadata:
      labels:
        app: akg-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 15
      containers:
        - name: frontend
          image: akg-frontend:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
          env:
            - name: API_BASE_URL
              value: "https://api.akg.company.com"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: akg-frontend
  namespace: akg
spec:
  selector:
    app: akg-frontend
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: akg-frontend
  namespace: akg
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: akg-frontend
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: akg-frontend
  namespace: akg
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: akg-frontend
