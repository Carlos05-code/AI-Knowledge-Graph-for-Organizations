apiVersion: apps/v1
kind: Deployment
metadata:
  name: akg-frontend
  namespace: akg
  labels:
    app: akg-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: akg-frontend
  template:
    metadata:
      labels:
        app: akg-frontend
    spec:
      containers:
        - name: frontend
          image: akg-frontend:latest
          ports:
            - containerPort: 80
          env:
            - name: API_BASE_URL
              value: "https://api.akg.company.com"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: akg-frontend
  namespace: akg
spec:
  selector:
    app: akg-frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: akg-frontend
  namespace: akg
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: akg-frontend
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
